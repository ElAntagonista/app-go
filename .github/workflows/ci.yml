name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch/PR; superseded PR runs are cancelled, main runs finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/golang --error --metrics=off

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  build:
    name: Test & build
    needs: [sast, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: make test
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            dist/*/app
            dist/checksums.txt
          retention-days: 7
