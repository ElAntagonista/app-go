version: 2

project_name: app

builds:
  - main: ./cmd/app
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# One SPDX SBOM per binary, catalogued by syft from the Go build info embedded
# in the binary. Named after the binary asset so the pair is obvious.
sboms:
  - artifacts: binary
    documents:
      - "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.json"
